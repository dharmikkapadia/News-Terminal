name: MarketWire history

# Keeps durable wire history IN THE REPO: fetches the RBI feeds (Press Releases +
# Notifications), SEBI's Public Issues listing and Trading Economics' news stream
# (India + World — both scraped; no RSS exists for either) on a schedule and commits
# data/history.jsonl + data/notifications.jsonl + data/sebi_public_issues.jsonl +
# data/te_india_news.jsonl + data/te_world_news.jsonl.
# The same run also refreshes the intraday overlays: the commodity-price snapshot
# (data/commodities.json), the Trading-Economics FX overlay (USD/EUR/GBP-INR in
# data/rates.json), the India macro Economic Calendar (data/calendar.json, merged onto the
# committed snapshot so released actuals land promptly) AND the investing.com scrapes — the
# India government-bond yield curve (market_trends.bonds) and the London (Robusta) coffee
# quote in the commodities snapshot, both rendered in a real browser via Scrapling — they
# move intraday, so FX/commodities/calendar ride every run (every 30 min via the external
# dispatch cron) while the investing.com scrapes run only on the 2-hourly schedule runs
# (the browser install is too heavy/flaky for every run — see below). The rest of the RBI
# Current Rates snapshot stays on its own once-a-day rates.yml.
# The Streamlit app reads those committed files, so everything survives Streamlit Cloud restarts
# with no external database.
#
# Note: committing updates the tracked branch, so Streamlit Cloud redeploys (a
# brief restart) whenever history changes — tune the cron below to taste. The
# run only commits when there's actually something new.

on:
  schedule:
    # GitHub's scheduler is unreliable — it drops most frequent crons (a "*/30"
    # actually fired roughly every 90 min here). So this is a best-effort FALLBACK;
    # the PRIMARY 30-min cadence comes from an external cron that hits the
    # workflow_dispatch API (see docs/OPERATIONS.md → "Reliable 30-min cadence"). The
    # repo is PUBLIC, so standard-runner Actions minutes are free — cadence is a
    # freshness/redeploy trade-off, not a billing one. (While the repo was private, the
    # 30-min cadence blew the 2,000-min/month free tier in ~20 days — July 2026; see
    # docs/OPERATIONS.md's Actions-minutes section before making the repo private again.)
    # These 2-hourly schedule runs are ALSO the only ones that do the heavy
    # investing.com scrapes (bond curve + London coffee — Scrapling stealth
    # browser + xvfb) — see below.
    - cron: "7 */2 * * *"
  workflow_dispatch: {}       # used by the external cron + manual runs (Actions tab)

permissions:
  contents: write             # needed to push the updated history file

concurrency:
  group: marketwire-history
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # The default job timeout is 6 HOURS — cap it so a hung Cloudflare solve / network
    # stall dies fast instead of blocking the next runs (concurrency group queues them).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser requests beautifulsoup4

      # Scrapling + a browser are needed ONLY for the investing.com scrapes — the
      # government-bond curve (bonds.poll_bonds) and the London coffee quote
      # (commodities.fetch_investing), both called from poll.py — investing.com blocks
      # bots, so those pages are fetched by rendering them in a real STEALTH browser
      # (non-headless under xvfb — much harder for Cloudflare to flag). The install +
      # renders add minutes and Cloudflare-flake exposure to a run, so they ride ONLY the
      # 2-hourly `schedule` runs, keeping the 30-min dispatch runs light and fast. On
      # dispatch runs the renders find no scrapling, fail fast and safely, and keep the
      # committed curve/price — bonds + coffee refresh up to ~12x/day while
      # history/FX/commodities refresh every run.
      - name: Install Scrapling stealth browser + xvfb (investing.com scrapes — schedule runs only)
        if: github.event_name == 'schedule'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install "scrapling[fetchers]"
          scrapling install

      - name: Fetch RBI + SEBI + TE news and update history (+ commodities / FX / investing.com bonds + coffee)
        env:
          # Optional: set these repo variables to also backfill older items from
          # RBI's listing page(s) for each feed.
          MARKETWIRE_ARCHIVE_URLS: ${{ vars.MARKETWIRE_ARCHIVE_URLS }}
          MARKETWIRE_NOTIFICATIONS_ARCHIVE_URLS: ${{ vars.MARKETWIRE_NOTIFICATIONS_ARCHIVE_URLS }}
          # investing.com scrapes (bonds.py + the coffee quote in commodities.py): run the
          # stealth browser non-headless under xvfb; dump each rendered HTML for diagnosis;
          # route through a proxy if configured.
          MARKETWIRE_BONDS_HEADLESS: "false"
          MARKETWIRE_BONDS_DUMP: ${{ runner.temp }}/bonds_dump.html
          MARKETWIRE_COFFEE_DUMP: ${{ runner.temp }}/coffee_dump.html
          # Dump the fetched TE calendar HTML for markup diagnosis (uploaded below).
          MARKETWIRE_CALENDAR_DUMP: ${{ runner.temp }}/calendar_dump.html
          # Same for the TE news stream — one dump per candidate URL tried
          # (te_stream_dump.1.html, .2.html, …), so the winning shape (JSON / HTML /
          # RSS) and any Cloudflare block are both visible.
          MARKETWIRE_TE_STREAM_DUMP: ${{ runner.temp }}/te_stream_dump.html
          # Set this repo SECRET to a (residential) proxy URL to reliably get past investing.com's
          # datacenter-IP 403 — e.g. http://user:pass@host:port. Empty = direct (often blocked).
          MARKETWIRE_SCRAPE_PROXY: ${{ secrets.MARKETWIRE_SCRAPE_PROXY }}
        # xvfb only exists on schedule runs (installed with the browser above);
        # dispatch runs poll without it — bonds no-op, everything else refreshes.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            xvfb-run -a python poll.py
          else
            python poll.py
          fi

      # Upload the rendered investing.com HTML (whatever the fetch got — the real table or a
      # Cloudflare block page) so the markup can be inspected when the bond curve doesn't update.
      # Only schedule runs render bonds, so only they can have a dump.
      - name: Upload bonds render dump (diagnostic)
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: bonds-render-dump
          path: ${{ runner.temp }}/bonds_dump.html
          if-no-files-found: ignore
          retention-days: 7

      # Same for the rendered investing.com London-coffee page (commodities.fetch_investing) —
      # its parser was written without live investing.com access, so the first schedule runs'
      # dumps are how the real markup gets confirmed/tuned.
      - name: Upload coffee render dump (diagnostic)
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: coffee-render-dump
          path: ${{ runner.temp }}/coffee_dump.html
          if-no-files-found: ignore
          retention-days: 7

      # The fetched TE calendar page (real table or a Cloudflare block page) — for tuning
      # econ_calendar.parse_calendar if the calendar doesn't populate. Schedule runs only,
      # to keep the frequent dispatch runs fast.
      - name: Upload calendar fetch dump (diagnostic)
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: calendar-fetch-dump
          path: ${{ runner.temp }}/calendar_dump.html
          if-no-files-found: ignore
          retention-days: 7

      # The bodies each TE-stream candidate returned (the real stream, a Cloudflare
      # block, or a 404 from a URL guess) — for tuning te_stream's parsers and pinning
      # the feed to whichever candidate actually serves the stream.
      - name: Upload TE stream fetch dumps (diagnostic)
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: te-stream-dump
          path: ${{ runner.temp }}/te_stream_dump.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit history + commodities + fx + bonds if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.jsonl data/notifications.jsonl data/sebi_public_issues.jsonl data/te_india_news.jsonl data/te_world_news.jsonl data/commodities.json data/rates.json data/calendar.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update history + sebi + te news + commodities + fx + bonds + calendar $(date -u +%FT%TZ)"
            # main has other writers (the rates workflows, branch merges) and this job's
            # checkout->push window spans the whole poll (minutes, more on the schedule
            # runs that render bonds), so a bare push can lose the race. Rebase and retry; -X theirs
            # keeps THIS run's freshly-polled data files on any conflict (rebase swaps sides:
            # "theirs" = the commit being replayed, i.e. ours — the freshest scrape).
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed; retrying in $((i*3))s"; sleep $((i*3))
            done
            echo "::error::push failed after 5 attempts"
            exit 1
          fi
